<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>किसान ऋण विवरण - समिति चुनें</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%);
    margin: 0; padding: 20px; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .card { text-align: center; }
  .card h1 { font-size: 20px; font-weight: 800; color: #0f766e; margin: 0 0 4px; }
  .card p.sub { font-size: 13px; color: #6b7280; text-align: center; margin: 0 0 20px; }
  .form-area { text-align: left; }
  label { display: block; font-size: 13px; font-weight: 600; color: #134e4a; margin-bottom: 6px; }
  select {
    width: 100%; padding: 12px; font-size: 15px; border-radius: 10px;
    border: 1px solid #d1d5db; margin-bottom: 16px; background: #f0fdfa; color: #111827;
  }
  select:disabled { background: #f3f4f6; color: #9ca3af; }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: #0f766e; color: white; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .msg { text-align: center; font-size: 13px; color: #dc2626; margin-top: 12px; min-height: 16px; }
  .meta { text-align: center; font-size: 11px; color: #9ca3af; margin: -14px 0 18px; }
  .dev-credit { text-align: center; color: #6b7280; font-size: 12px; margin-top: 20px; line-height: 1.6; }
  .dev-credit b { color: #134e4a; }
  .dev-credit {
    text-align: center; color: #e2f5f2; font-size: 12px; margin-top: 22px;
    padding-bottom: 4px; line-height: 1.6;
  }
  .dev-credit b { color: white; }
  .last-updated {
    text-align: center; color: #e2f5f2; font-size: 11px; margin-top: 6px; opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAHgAAAByCAYAAACY/xW0AABZx0lEQVR42p3955McR7rmif7cPSIys7SuQhUKWmtJApSganZP9zlzzuzszlzba2O797+4d/bD/hX7Ye3ams3O3NE9p8/p04rsZlODIAlBSEKLAlBaZqWKCHe/HzwiVWUV0ANaGYGqrMyIcPdXPO/zPq+ISqs2NhYsAAghQFD9d/o9S+01zT+vvbDu7zb9n01+tPZ9G/4t3F+tFUhha+/R9BqBuxZtQMn6H6a/0/BihJBYY+uuzzZehm267uq1Cqy1WGMRQiBk8m9r17xWiKbbSn634UaFqPtMC0K4z2l+YM3XhkVrk75x9frdh1YXDWMMQgiUUtX/e56Ppw1E2jasnfvd2gdKKZPrsi1W0zbcWP09QPJAhKB+LdIHJaWsvqfbWO73munznqoO9wtoW7RXNW8j8AAAAABJRU5ErkJggg==" alt="logo" style="width:56px;height:56px;margin-bottom:8px;">
    <h1>किसान ऋण विवरण</h1>
    <p class="sub">अपना जिला और समिति चुनें</p>
    <p class="meta" id="lastUpdated"></p>

    <div class="form-area">
      <label for="districtSelect">जिला</label>
      <select id="districtSelect">
        <option value="">-- जिला चुनें --</option>
      </select>

      <label for="samitiSelect">समिति</label>
      <select id="samitiSelect" disabled>
        <option value="">-- पहले जिला चुनें --</option>
      </select>

      <button id="goBtn" disabled>आगे बढ़ें</button>
      <p class="msg" id="msgBox"></p>
    </div>

    <div class="dev-credit">
      Developed by- <b>Yoogle.Com</b><br>
      Developer- Yugal Verma, 6263777500<br>
      Gmail ID- pacs.automation.yoogle@gmail.com
    </div>
    <div class="last-updated">
      Version: v1.1 &nbsp;|&nbsp; अंतिम अपडेट: 22/08/2026
    </div>
  </div>

<script>
  // Yeh version SIRF tab badalta hai jab selector page ke CODE me koi
  // sudhar/naya feature aata hai - data refresh se yeh apne aap NAHI badalta.
  var SELECTOR_VERSION = "1.0.0";
  document.getElementById('versionTag').textContent = 'Version ' + SELECTOR_VERSION;

  var directory = [];

  fetch('pacs_directory.json?_=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      // naya format: {updated_at, pacs: [...]}. purana format (sirf array)
      // bhi chal jaye isliye dono handle kar rahe hain.
      if (Array.isArray(data)) {
        directory = data;
      } else {
        directory = data.pacs || [];
        if (data.updated_at) {
          document.getElementById('lastUpdated').textContent = 'सूची अंतिम अपडेट: ' + data.updated_at;
        }
      }
      var districts = [];
      for (var i = 0; i < directory.length; i++) {
        var d = directory[i].district;
        if (d && districts.indexOf(d) === -1) districts.push(d);
      }
      districts.sort();
      var ds = document.getElementById('districtSelect');
      for (var j = 0; j < districts.length; j++) {
        var opt = document.createElement('option');
        opt.value = districts[j];
        opt.textContent = districts[j];
        ds.appendChild(opt);
      }
      if (districts.length === 0) {
        document.getElementById('msgBox').textContent = 'अभी कोई समिति उपलब्ध नहीं है।';
      }
    })
    .catch(function() {
      document.getElementById('msgBox').textContent = 'सूची लोड नहीं हो पाई। कृपया दोबारा प्रयास करें।';
    });

  document.getElementById('districtSelect').addEventListener('change', function() {
    var ss = document.getElementById('samitiSelect');
    var goBtn = document.getElementById('goBtn');
    ss.innerHTML = '<option value="">-- समिति चुनें --</option>';
    var chosenDistrict = this.value;
    var filtered = [];
    for (var i = 0; i < directory.length; i++) {
      if (directory[i].district === chosenDistrict) filtered.push(directory[i]);
    }
    for (var k = 0; k < filtered.length; k++) {
      var opt = document.createElement('option');
      opt.value = filtered[k].folder;
      opt.textContent = filtered[k].short_name || filtered[k].folder;
      ss.appendChild(opt);
    }
    ss.disabled = filtered.length === 0;
    goBtn.disabled = true;
  });

  document.getElementById('samitiSelect').addEventListener('change', function() {
    document.getElementById('goBtn').disabled = !this.value;
  });

  document.getElementById('goBtn').addEventListener('click', function() {
    var ss = document.getElementById('samitiSelect');
    if (ss.value) {
      window.location.href = ss.value + '/';
    }
  });
</script>
</body>
</html>
